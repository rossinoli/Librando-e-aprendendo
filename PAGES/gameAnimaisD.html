<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👋</text></svg>">
  <link rel="stylesheet" href="../assets/CSS/reset.css">
  <link rel="stylesheet" href="../assets/CSS/game.css">

  

  <title>Sinaliza e Combina</title>
</head>

<body>
<!-- TELA DE CARREGAMENTO (Coloque aqui no topo do body) -->
  <div id="loading-screen" class="loading-screen">
    <img src="../images/logo.png" alt="Mão Libras" class="waving-hand" />
    <p>Carregando sinais em Libras...</p>
  </div>
  <main>
    <header>
      <span class="player"></span>
      <span>Tempo: <span class="timer">00</span></span>
    </header>

    <div class="grid"></div>
  </main>
      <!-- MODAL DE VITÓRIA (FIM DE JOGO) -->
  <div id="modal-victory" class="modal hidden">
    <div class="modal-content">
      <h2>🎉 Parabéns!</h2>
      <p>Jogador(a): <strong id="player-name-modal">thaina</strong></p>
      <p>Tempo final: <strong id="player-time-modal">00</strong> segundos</p>
      
      <div class="modal-actions">
        <a href="home.html" class="btn-home">Voltar ao Início</a>
        <button onclick="location.reload()" class="btn-restart">Jogar Novamente</button>
      </div>
    </div>
  </div>

  <script  src="../assets/JS/gameAnimaisD.js"></script>
</body>

</html>
